sonar.projectKey=task-manager
sonar.projectName=Task Manager
sonar.sourceEncoding=UTF-8

# Assumes each app keeps its code in src/ (adjust if not)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.d.ts

# Only the backend tests run in your pipeline, so only backend coverage is imported
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
