name: Task Manager CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  manifest-validation-test:
    name: Validate k8s manifests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run manifest validation tests
        run: npm run test:manifests

  sonarqube-analysis:
    name: Backend tests & SonarQube analysis
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for blame and new-code detection

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit & property tests with coverage
        working-directory: backend
        run: npm run test -- --coverage.enabled --coverage.reporter=lcov

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6   # check for the latest major version
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

  security:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        # continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
          # args: --file=backend/package.json 
  
  build-docker-images:
    runs-on: self-hosted
    needs: [manifest-validation-test, sonarqube-analysis]
    strategy:
      matrix:
        # Use include to add custom configurations.
        include:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: workshop-frontend

          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: workshop-backend 
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.image }}:latest
            # tags: |
            # ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            # ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.run_number }}

  deploy:
    needs: build-docker-images
    uses: ./.github/workflows/cd.yaml
